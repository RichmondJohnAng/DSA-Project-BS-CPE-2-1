<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Craze - Richmond John Ang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Playfair+Display:ital,wght@1,600;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="standalone-home-body">
    <header class="standalone-header">
        <div class="standalone-header-inner">
            <div class="standalone-brand">
                <a href="/" class="mobile-brand" title="Code Craze">
                    <span class="standalone-brand-title">Code Craze</span>
                </a>
            </div>
            <div class="standalone-header-right">
                <a href="/profile" class="header-hub-btn desktop-only" title="Enter Hub">Enter Hub</a>
                <button type="button" class="hamburger-btn mobile-only" id="homeHamburgerBtn" aria-label="Toggle navigation menu" aria-expanded="false">
                    <span class="hamburger-icon">
                        <span class="hamburger-line line-1"></span>
                        <span class="hamburger-line line-2"></span>
                        <span class="hamburger-line line-3"></span>
                    </span>
                </button>
            </div>
        </div>
    </header>

    <div class="mobile-nav-backdrop" id="homeNavBackdrop"></div>
    <nav class="mobile-nav-drawer" id="homeNavDrawer" aria-label="Mobile Navigation">
        <div class="mobile-drawer-header">
            <span class="mobile-drawer-tag">Menu</span>
        </div>
        <ul class="mobile-nav-links">
            <li>
                <a href="/profile" class="mobile-nav-link">
                    <span class="mobile-nav-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </span>
                    <span class="mobile-nav-text">Profile</span>
                </a>
            </li>
            <li>
                <a href="/" class="mobile-nav-link active">
                    <span class="mobile-nav-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                            <polyline points="9 22 9 12 15 12 15 22" />
                        </svg>
                    </span>
                    <span class="mobile-nav-text">Home</span>
                    <span class="mobile-active-indicator">&bull;</span>
                </a>
            </li>
            <li>
                <a href="/projects" class="mobile-nav-link">
                    <span class="mobile-nav-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="7" height="7" x="3" y="3" rx="1" />
                            <rect width="7" height="7" x="14" y="3" rx="1" />
                            <rect width="7" height="7" x="14" y="14" rx="1" />
                            <rect width="7" height="7" x="3" y="14" rx="1" />
                        </svg>
                    </span>
                    <span class="mobile-nav-text">Projects</span>
                </a>
            </li>
            <li>
                <a href="/contact" class="mobile-nav-link">
                    <span class="mobile-nav-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2" />
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                        </svg>
                    </span>
                    <span class="mobile-nav-text">Contact</span>
                </a>
            </li>
        </ul>
    </nav>

    <main class="standalone-main">
        <div class="hero-split-container">
            <div class="hero-text-col">
                <p class="hero-hello">Hello, I am</p>
                <h1 class="hero-name">Richmond John Ang</h1>
                <h2 class="hero-headline">BS CpE 2-1</h2>
                <p class="hero-desc">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore
                    et dolore magna aliqua.
                </p>
            </div>
            <div class="hero-pfp-col">
                <div class="hero-pfp-frame">
                    <svg width="128" height="128" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="hero-pfp-svg">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </div>
            </div>
        </div>
    </main>

    <script>
        (function () {
            const btn = document.getElementById('homeHamburgerBtn');
            const drawer = document.getElementById('homeNavDrawer');
            const backdrop = document.getElementById('homeNavBackdrop');

            if (!btn || !drawer) return;

            function toggleDrawer() {
                const isOpen = drawer.classList.toggle('open');
                btn.classList.toggle('active', isOpen);
                btn.setAttribute('aria-expanded', isOpen);
                if (backdrop) backdrop.classList.toggle('open', isOpen);
                document.body.classList.toggle('nav-locked', isOpen);
            }

            function closeDrawer() {
                drawer.classList.remove('open');
                btn.classList.remove('active');
                btn.setAttribute('aria-expanded', 'false');
                if (backdrop) backdrop.classList.remove('open');
                document.body.classList.remove('nav-locked');
            }

            btn.addEventListener('click', toggleDrawer);
            if (backdrop) backdrop.addEventListener('click', closeDrawer);

            const links = drawer.querySelectorAll('.mobile-nav-link');
            links.forEach(function (l) {
                l.addEventListener('click', closeDrawer);
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && drawer.classList.contains('open')) {
                    closeDrawer();
                }
            });
        })();
    </script>
</body>

</html>
