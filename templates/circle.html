{% extends "base.html" %}

{% block title %}Area of Circle{% endblock %}

{% block content %}
<div class="card">
    <h1>Area of a Circle</h1>
    <p>Calculate the area of a circle.</p>

    {% if error %}
    <div class="alert alert-error">
        <span class="alert-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </span>
        <span>{{ error }}</span>
    </div>
    {% endif %}

    <form action="/works/area/circle" method="post">
        <div class="form-group">
            <label for="radius">Radius (r):</label>
            <input type="number" step="any" min="0.0001" id="radius" name="radius" value="{{ radius or '' }}" required placeholder="Enter positive circle radius">
        </div>
        <button type="submit">Compute Area</button>
    </form>

    {% if result is not none %}
    <div class="result-card">
        <label>Computed Area:</label>
        <div class="result-value">{{ result }}</div>
    </div>
    {% endif %}
</div>
{% endblock %}
